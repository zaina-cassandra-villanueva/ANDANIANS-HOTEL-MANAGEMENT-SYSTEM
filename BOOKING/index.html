<style>

.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}

label{font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-weight:500;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);outline:none}

.btn:active{transform:scale(.96)}.btn.o{background:transparent;color:var(--deep);border:2px solid var(--sea);box-shadow:none}.btn.r{background:var(--coral);box-shadow:none}.btn.g{background:var(--ok);box-shadow:none}.btn.s{padding:6px 11px;font-size:12px;border-radius:9px}.btn:disabled{opacity:.5}
.room{padding:0;overflow:hidden}.rimg{height:130px;display:flex;align-items:center;justify-content:center;font-size:54px;background:linear-gradient(135deg,var(--sky),var(--aqua),var(--sand))}
.rb{padding:14px}.price{font-size:22px;font-weight:800;color:var(--sea)}

.tw{overflow-x:auto;max-width:100%}

.f{margin-bottom:12px}.err{color:#be123c;font-weight:600;font-size:13px;margin:6px 0}

.empty{text-align:center;padding:36px 16px;color:var(--mu)}.empty b{display:block;font-size:40px}
.qr{display:block;margin:10px auto;width:150px;height:150px;background:#fff;padding:8px;border-radius:12px;border:2px solid var(--bd)}
.cal td{text-align:center;padding:6px 3px;font-size:11px}.cal .rs{background:#fde68a}.cal .oc{background:#7dd3fc}
footer{background:var(--navy);color:#bae6fd;padding:26px 16px;text-align:center;font-size:13px;line-height:1.8;margin-top:30px;border-radius:20px}
.sw{position:relative;width:42px;height:24px;background:var(--bd);border-radius:99px;cursor:pointer;flex-shrink:0}.sw.on{background:var(--ok)}.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw.on::after{left:21px}
.fab{position:fixed;bottom:22px;right:18px;z-index:140;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--sea),var(--aqua));color:#fff;border:0;font-size:24px;box-shadow:0 6px 20px #0ea5e966;cursor:pointer}
.chat{position:fixed;bottom:88px;right:18px;z-index:140;width:320px;max-width:92vw;max-height:70vh;background:var(--card);border:1.5px solid var(--bd);border-radius:18px;box-shadow:0 10px 30px #0369a144;display:none;flex-direction:column;overflow:hidden}
.chat.on{display:flex}.chat header{position:static;background:linear-gradient(90deg,var(--deep),var(--sea));color:#fff;padding:12px 14px;box-shadow:none}
.chat .cbody{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.chat .msg{max-width:85%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.4}
.chat .msg a{color:inherit;font-weight:700}
.chat .msg.bot{background:var(--bg);align-self:flex-start;border:1px solid var(--bd)}
.chat .msg.me{background:var(--sea);color:#fff;align-self:flex-end}
.chat .quick{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid var(--bd)}
.chat .quick button{font-size:11px;padding:5px 10px;border-radius:99px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
.chat .cin{display:flex;gap:6px;padding:10px;border-top:1px solid var(--bd)}.chat .cin input{flex:1}
.mapf{width:100%;height:260px;border:0;display:block}
@media print{header,nav,#toast,.np,.fab,.chat{display:none!important}}
</style></head><body>
<header><div class="top"><div class="logo" onclick="go('home')">🌴 Andanian's Hotel<small>ANDA, PANGASINAN</small></div>

<script>
const $=s=>document.querySelector(s),peso=n=>'₱'+Math.round(n).toLocaleString(),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},TD=iso(0);
const fd=s=>s?new Date(s+'T00:00').toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'}):'—',nts=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const T=[{id:'dlx',n:'Deluxe Room',p:2800,cap:2,bed:'Queen bed',e:'🛏️',am:['Aircon','Wi-Fi','Smart TV','Private bathroom','Garden view'],d:'A cozy garden-view room, perfect for couples.'},
{id:'sup',n:'Superior Room',p:3800,cap:3,bed:'Queen + single',e:'🌴',am:['Aircon','Balcony','Wi-Fi','Mini fridge','Pool view'],d:'Spacious room with balcony overlooking the pool.'},
{id:'fam',n:'Family Suite',p:5500,cap:5,bed:'2 bedrooms',e:'👨‍👩‍👧‍👦',am:['Aircon','Kitchenette','Sofa bed','Bathtub','Wi-Fi','Sea view'],d:'Two bedrooms with a kitchenette and sea views.'},
{id:'pre',n:'Presidential Suite',p:8500,cap:4,bed:'King bed',e:'🌟',am:['Jacuzzi','Private terrace','Butler','Smart TV','Wi-Fi','Panoramic view'],d:'Our finest: panoramic sea view, jacuzzi and butler.'}];
let R=[101,102,103,104,105].map(n=>({no:n,t:'dlx',st:'Available'})).concat([201,202,203,204].map(n=>({no:n,t:'sup',st:n==204?'Maintenance':'Available'})),[301,302,303].map(n=>({no:n,t:'fam',st:'Available'}))[0]?[301,302,303].map(n=>({no:n,t:'fam',st:'Available'})):[],[{no:401,t:'pre',st:'Available'}]);
let U=[{n:'Admin Maria',e:'admin@andanian.ph',r:'Admin',a:1,pw:'demo1234',c:'2026-01-10'},{n:'Staff Juan',e:'staff@andanian.ph',r:'Staff',a:1,pw:'demo1234',perm:['Payments','Walk-in','Rooms','Reports'],c:'2026-02-01'},{n:'Ana Reyes',e:'ana@mail.com',r:'Customer',a:1,pw:'demo1234',c:'2026-08-15'}];
let P=[{c:'SUMMER10',pc:10,on:1,s:'2026-06-01',e:'2026-12-31'},{c:'ANDA20',pc:20,on:1,s:'2026-06-01',e:'2026-12-31'},{c:'WELCOME15',pc:15,on:1,s:'2026-01-01',e:'2026-12-31'}];
let H={name:"Andanian's Hotel",desc:'Warm Filipino hospitality on the white-sand shores of Anda, Pangasinan.',addr:'Brgy. Tondol, Anda, Pangasinan',phone:'0917 000 0000',email:'hello@andanian.ph',am:'🌐 Free Wi-Fi, 🏊 Pool, 🍳 Restaurant, 🚗 Parking, 💆 Hilot Spa, 🌅 Sea View, 🍹 Bar, 🕐 24/7 Staff',pol:'Check-in 2 PM · Check-out 12 NN · Free cancellation 48 hrs before arrival.'};
let ST={cancelHrs:48,gcashNo:'0917 000 0000',gcashName:'Andanian Hotel',notif:1,tax:12};
const SM={fb:'https://facebook.com/AndaniansHotelPH',ig:'https://instagram.com/andanianshotel',tt:'https://tiktok.com/@andanianshotel',msg:'https://m.me/AndaniansHotelPH'};
let B=[],LOG=[],N={Customer:[],Staff:[],Admin:[]},S={role:'Guest',user:null,page:'home',bk:{ci:iso(1),co:iso(3),ad:2,ch:0,rooms:1,t:''},tab:'Upcoming',sel:null,filt:'All',fp:0,ref:1020};
const act=b=>!['Cancelled','Checked-out','Rejected'].includes(b.status);
const free=(t,ci,co)=>R.filter(r=>r.t===t&&r.st!=='Maintenance'&&!B.some(b=>act(b)&&b.u.includes(r.no)&&b.ci<co&&b.co>ci));
const log=m=>LOG.unshift({w:S.user?.n||'System',m,t:new Date().toLocaleString('en-PH')});
const notify=(r,m)=>{N[r].unshift({m,t:new Date().toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'})})};
function mk(o){const f=free(o.t,o.ci,o.co);if(f.length<o.rooms)return null;const b={...o,u:f.slice(0,o.rooms).map(r=>r.no),id:'AND-'+(++S.ref),status:o.status||'Pending',pay:o.pay||'Pending',ts:new Date().toLocaleString('en-PH')};B.push(b);return b}
[['Ana Reyes','dlx',-1,2,'Approved','Checked-in'],['Ben Cruz','sup',1,4,'Approved','Confirmed'],['Cathy Lim','fam',0,2,'Pending','Pending'],['Dan Uy','dlx',3,6,'Approved','Confirmed']].forEach(([c,t,a,b,p,s])=>mk({cust:c,email:c.split(' ')[0].toLowerCase()+'@mail.com',phone:'0917123456',t,ci:iso(a),co:iso(b),ad:2,ch:0,rooms:1,total:T.find(x=>x.id===t).p*(b-a),pay:p,status:s,src:'Online',ref:'GC'+(a+9)+'778'}));
const price=(t,ci,co,n=1,pc=0)=>{const r=T.find(x=>x.id===t).p*nts(ci,co)*n,d=r*pc/100,tx=(r-d)*ST.tax/100;return{r,d,tx,tot:r-d+tx}};
const st=(cls,x)=>`<span class="tag ${cls}">${x}</span>`,bs=s=>st({Confirmed:'ok',Pending:'wa','Checked-in':'',Cancelled:'no','Checked-out':'',Approved:'ok',Paid:'ok',Rejected:'no'}[s]||'',s);
const empty=(i,m)=>`<div class="empty"><b>${i}</b>${m}</div>`,tbl=(h,rows,em)=>rows.length?`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`:empty('📭',em||'Nothing here yet.');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
function M(h){$('#mb').innerHTML=h;$('#modal').classList.add('on')}function closeM(){$('#modal').classList.remove('on')}
function theme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'}
function toggleChat(){const c=$('#chat');c.classList.toggle('on');if(c.classList.contains('on')&&!S.chatInit){S.chatInit=1;pushBot("Hi! I'm the Andanian's AI Concierge 🌴 Ask me about rooms, rates, check-in or things to do — or tap a question below.");quickBtns()}}
function pushBot(m){$('#cbody').insertAdjacentHTML('beforeend',`<div class="msg bot">${m}</div>`);$('#cbody').scrollTop=1e9}
function pushMe(m){$('#cbody').insertAdjacentHTML('beforeend',`<div class="msg me">${esc(m)}</div>`);$('#cbody').scrollTop=1e9}

function sendChat(){const v=$('#cin').value.trim();if(!v)return;$('#cin').value='';ask(v)}
function aiReply(q){const s=q.toLowerCase();
if(s.includes('rate')||s.includes('price')||s.includes('cost')||s.includes('how much'))return`Our rooms range from ${peso(Math.min(...T.map(t=>t.p)))} to ${peso(Math.max(...T.map(t=>t.p)))} per night, and rates move with demand. Check <a href="#" onclick="toggleChat();go('dprice');return false">today's Smart Rates</a> or get a personalized pick from our <a href="#" onclick="toggleChat();go('rec');return false">AI Recommendation</a>.`;
if(s.includes('check-in')||s.includes('checkin')||s.includes('check in')||s.includes('checkout')||s.includes('check-out')||s.includes('check out'))return`Check-in is 2 PM and check-out is 12 NN. Free cancellation up to ${ST.cancelHrs} hours before check-in.`;
if(s.includes('cancel'))return`Free cancellation up to ${ST.cancelHrs} hours before check-in — no questions asked.`;
if(s.includes('where')||s.includes('location')||s.includes('address')||s.includes('map')||s.includes('direction'))return`We're at ${esc(H.addr)}. <a href="#" onclick="toggleChat();go('about');return false">See the map &amp; get directions</a>.`;
if(s.includes(' do')||s.startsWith('do')||s.includes('beach')||s.includes('itiner')||s.includes('tour')||s.includes('activit')||s.includes('island'))return`Anda is packed with white-sand beaches and island hopping! Check our <a href="#" onclick="toggleChat();go('itin');return false">Things To Do guide</a> for a ready-made getaway itinerary.`;
if(s.includes('wifi')||s.includes('amenit')||s.includes('pool')||s.includes('breakfast')||s.includes('parking'))return`We offer ${esc(H.am)}.`;
if(s.includes('book')||s.includes('reserve')||s.includes('availab'))return`Let's get you booked! <a href="#" onclick="toggleChat();go('search');return false">Tap here to search rooms</a> for your dates.`;
if(s.includes('human')||s.includes('staff')||s.includes('agent')||s.includes('talk')||s.includes('call'))return`Sure — message us on <a href="${SM.msg}" target="_blank" rel="noopener">Messenger</a> and our team will reply shortly.`;
return`Great question! Try one of the quick questions below, or message us directly on <a href="${SM.msg}" target="_blank" rel="noopener">Messenger</a> for anything else.`}
const NAV={Guest:[['home','🏠 Home'],['rooms','🛏️ Rooms'],['search','📅 Book'],['rec','✨ AI Pick'],['dprice','💡 Smart Rates'],['itin','🗺️ Things To Do'],['about','ℹ️ About'],['demo','🚨 Double-Booking Demo'],['login','🔐 Login']],
Customer:[['home','🏠 Home'],['rooms','🛏️ Rooms'],['search','📅 Book'],['rec','✨ AI Pick'],['dprice','💡 Smart Rates'],['itin','🗺️ Things To Do'],['mine','📖 My Bookings'],['notes','🔔 Alerts'],['profile','👤 Profile'],['about','ℹ️ About'],['demo','🚨 Demo']],
Staff:[['sdash','📊 Dashboard'],['sbook','📋 Bookings'],['pays','💳 Payments'],['walk','🚶 Walk-in'],['ci','🛎️ Check-in/out'],['srooms','🏨 Rooms'],['cal','📅 Calendar'],['rep','📈 Reports'],['notes','🔔 Alerts'],['demo','🚨 Demo']],

function go(p,x){if(x!==undefined)S.sel=x;S.page=p;closeM();render();scrollTo(0,0)}
function render(){const PM={pays:'Payments',walk:'Walk-in',srooms:'Rooms',rep:'Reports'},nv=NAV[S.role].filter(([p])=>!(S.role==='Staff'&&PM[p]&&S.user.perm&&!S.user.perm.includes(PM[p])));$('#nav').innerHTML=nv.map(([p,l])=>`<a class="${S.page===p?'on':''}" onclick="go('${p}')">${l}</a>`).join('')+(S.role!=='Guest'?`<a onclick="logout()">🚪 Logout</a>`:'');

demo(){return`<h1>🚨 Double-Booking Prevention</h1><p class="mu" style="margin:6px 0 12px">The Presidential Suite has only 1 room. Two customers try to book the same dates at the same time.</p><div class="card"><div class="row"><div><label>Same dates</label><div class="row"><input type="date" id="dd1" value="${iso(20)}"><input type="date" id="dd2" value="${iso(22)}"></div></div><button class="btn" onclick="runDemo()">▶ Run simulation</button></div><div id="demo" style="margin-top:14px"></div></div>`},
sdash(){const a=B.filter(act),tb=B.filter(b=>b.ts.length&&b.status!=='Cancelled');return`<h1>📊 Staff Dashboard</h1>${stats()}<h2>Booking status</h2><div class="card">${['Pending','Confirmed','Checked-in','Checked-out','Cancelled'].map(s=>{const c=B.filter(b=>b.status===s).length;return`<div class="row" style="margin:6px 0"><span style="width:100px;font-size:13px">${s}</span><div class="bar" style="flex:1"><i style="width:${B.length?c/B.length*100:0}%"></i></div><b>${c}</b></div>`}).join('')}</div><h2>Room occupancy</h2>${occBars()}`},
adash(){const rev=B.filter(b=>['Approved','Paid'].includes(b.pay)).reduce((s,b)=>s+b.total,0);return`<h1>👑 Admin Dashboard</h1>${stats()}<div class="grid" style="margin-top:14px"><div class="card stat"><b>${peso(rev)}</b><span>Revenue</span></div><div class="card stat"><b>${B.length}</b><span>Total bookings</span></div><div class="card stat"><b>${U.filter(u=>u.r==='Customer').length}</b><span>Customers</span></div></div><h2>Popular room types</h2><div class="card">${T.map(t=>{const c=B.filter(b=>b.t===t.id).length;return`<div class="row" style="margin:6px 0"><span style="width:130px;font-size:13px">${t.n}</span><div class="bar" style="flex:1"><i style="width:${B.length?c/B.length*100:0}%"></i></div><b>${c}</b></div>`}).join('')}</div><h2>Booking sources</h2><div class="card">${['Online','Walk-in'].map(s=>`<div class="pr"><span>${s}</span><b>${B.filter(b=>b.src===s).length}</b></div>`).join('')}</div><h2>Occupancy</h2>${occBars()}<h2>Booking trend (by check-in)</h2><div class="card">${Array.from({length:7},(_,i)=>{const d=iso(i-2),c=B.filter(b=>b.ci===d&&b.status!=='Cancelled'),m=Math.max(1,B.length);return`<div class="row" style="margin:6px 0"><span style="width:100px;font-size:13px">${fd(d)}</span><div class="bar" style="flex:1"><i style="width:${c.length/m*100}%"></i></div><b>${c.length}</b><span class="mu">${peso(c.reduce((s,b)=>s+b.total,0))}</span></div>`}).join('')}</div>`},
sbook(){const l=B.filter(b=>S.filt==='All'||b.status===S.filt).filter(b=>!S.q||(b.id+b.cust).toLowerCase().includes(S.q.toLowerCase())).sort((a,b)=>S.so==='ci'?a.ci.localeCompare(b.ci):S.so==='amt'?b.total-a.total:0);return`<h1>📋 Booking Management</h1><div class="row" style="margin:12px 0"><input style="max-width:240px" placeholder="🔍 Search name or ID" value="${esc(S.q||'')}" oninput="S.q=this.value;render();this.focus()"><select style="max-width:170px" onchange="S.filt=this.value;render()">${['All','Pending','Confirmed','Checked-in','Checked-out','Cancelled'].map(s=>`<option ${S.filt===s?'selected':''}>${s}</option>`).join('')}</select><select style="max-width:170px" onchange="S.so=this.value;render()"><option value="">Sort: Newest</option><option value="ci"${S.so==='ci'?' selected':''}>Sort: Check-in</option><option value="amt"${S.so==='amt'?' selected':''}>Sort: Amount</option></select></div><div class="card">${tbl(['ID','Customer','Room','Check-in','Check-out','Payment','Status','Actions'],(S.so?l:l.slice().reverse()).map(b=>[b.id,esc(b.cust),T.find(x=>x.id===b.t).n,fd(b.ci),fd(b.co),bs(b.pay),bs(b.status),`<button class="btn s o" onclick="bdet('${b.id}')">View</button>${act(b)?` <button class="btn s o" onclick="editB('${b.id}')">Edit</button>`:''}${b.status==='Confirmed'?` <button class="btn s" onclick="setSt('${b.id}','Checked-in')">Check-in</button>`:''}${b.status==='Checked-in'?` <button class="btn s g" onclick="setSt('${b.id}','Checked-out')">Check-out</button>`:''}${b.status==='Pending'?` <button class="btn s g" onclick="approve('${b.id}')">Confirm</button>`:''}${act(b)?` <button class="btn s r" onclick="staffCancel('${b.id}')">Cancel</button>`:''}`]),'No bookings.')}</div>`},
pays(){const l=B.filter(b=>b.pay==='Pending');return`<h1>💳 Payment Verification</h1><div class="card" style="margin-top:12px">${tbl(['Booking','Customer','Amount','Reference','Proof','Actions'],l.map(b=>[b.id,esc(b.cust),peso(b.total),esc(b.ref||'—'),b.proof?'🧾 '+esc(b.proof):'—',`<button class="btn s g" onclick="approve('${b.id}')">Approve</button> <button class="btn s r" onclick="rejM('${b.id}')">Reject</button>`]),'No pending payments 🎉')}</div>`},
walk(){return`<h1>🚶 Walk-in Booking</h1><div class="card" style="margin-top:12px;max-width:560px">${[['wn','Customer name'],['wc','Contact']].map(f=>`<div class="f"><label>${f[1]}</label><input id="${f[0]}"></div>`).join('')}<div class="f"><label>Room</label><select id="wt">${T.map(t=>`<option value="${t.id}">${t.n} — ${peso(t.p)} (${free(t.id,TD,iso(1)).length} free tonight)</option>`).join('')}</select></div><div class="frow row"><div style="flex:1"><label>Check-in</label><input type="date" id="wi" value="${TD}"></div><div style="flex:1"><label>Check-out</label><input type="date" id="wo" value="${iso(1)}"></div></div><div class="row" style="margin:12px 0"><div style="flex:1"><label>Guests</label><input type="number" id="wg" value="2" min="1"></div><div style="flex:1"><label>Payment method</label><select id="wm"><option>Cash</option><option>GCash</option><option>Card</option></select></div></div><div id="wer" class="err"></div><button class="btn" onclick="doWalk()">Check availability &amp; Confirm</button></div>`},
ci(){const a=B.filter(b=>b.status==='Confirmed'&&b.ci<=TD),o=B.filter(b=>b.status==='Checked-in');return`<h1>🛎️ Check-in / Check-out</h1><h2>Today's arrivals</h2><div class="card">${tbl(['Booking','Guest','Room','Action'],a.map(b=>[b.id,esc(b.cust),b.u.join(', '),`<button class="btn s" onclick="setSt('${b.id}','Checked-in')">Check-in</button>`]),'No arrivals today.')}</div><h2>In-house / departures</h2><div class="card">${tbl(['Booking','Guest','Room','Balance','Action'],o.map(b=>[b.id,esc(b.cust),b.u.join(', '),b.pay==='Approved'||b.pay==='Paid'?'₱0':peso(b.total),`<button class="btn s g" onclick="setSt('${b.id}','Checked-out')">Check-out</button>`]),'No guests in-house.')}</div>`},
srooms(){return`<h1>🏨 Room Management</h1><div class="card" style="margin:12px 0">${tbl(['Room','Type','Capacity','Price','Status','Actions'],R.map(r=>{const t=T.find(x=>x.id===r.t),cur=B.some(b=>b.status==='Checked-in'&&b.u.includes(r.no))?'Occupied':B.some(b=>b.status==='Confirmed'&&b.u.includes(r.no)&&b.ci<=TD&&b.co>TD)?'Reserved':r.st;return[r.no,t.n,t.cap,peso(t.p),st(cur==='Available'?'ok':cur==='Maintenance'?'no':'wa',cur),`<select onchange="R.find(x=>x.no==${r.no}).t=this.value;log('Room ${r.no} type changed');render()">${T.map(t=>`<option value="${t.id}"${t.id===r.t?' selected':''}>${t.n}</option>`).join('')}</select> <select onchange="R.find(x=>x.no==${r.no}).st=this.value;log('Room ${r.no} set to '+this.value);render()"><option${r.st=='Available'?' selected':''}>Available</option><option${r.st=='Maintenance'?' selected':''}>Maintenance</option></select> <button class="btn s r" onclick="R=R.filter(x=>x.no!=${r.no});log('Removed room ${r.no}');render()">Remove</button>`]}))}</div><div class="card row"><input id="nr" type="number" placeholder="Room no." style="max-width:120px"><select id="nt" style="max-width:180px">${T.map(t=>`<option value="${t.id}">${t.n}</option>`).join('')}</select><button class="btn" onclick="const n=+$('#nr').value;if(!n||R.some(r=>r.no==n))return toast('⚠️ Enter a unique room number');R.push({no:n,t:$('#nt').value,st:'Available'});log('Added room '+n);render()">+ Add room</button></div>`},
cal(){const d=Array.from({length:14},(_,i)=>iso(i));return`<h1>📅 Reservation Calendar</h1><p class="mu">Next 14 days · <span class="tag wa">Reserved</span><span class="tag">Occupied</span></p><div class="card cal" style="margin-top:10px"><div class="tw"><table><tr><th>Room</th>${d.map(x=>`<th>${x.slice(8)}</th>`).join('')}</tr>${R.map(r=>`<tr><td><b>${r.no}</b></td>${d.map(x=>{const b=B.find(b=>act(b)&&b.u.includes(r.no)&&b.ci<=x&&b.co>x);return`<td class="${b?(b.status==='Checked-in'?'oc':'rs'):''}" title="${b?esc(b.cust):''}">${r.st==='Maintenance'?'🔧':b?'●':''}</td>`}).join('')}</tr>`).join('')}</table></div></div>`},
rep(){const rt=S.rt||'Booking',f=S.rf||iso(-30),to=S.rto||iso(30),l=B.filter(b=>b.ci<=to&&b.co>=f),paid=b=>['Approved','Paid'].includes(b.pay),rn=b=>T.find(x=>x.id===b.t).n;let body='';
if(rt==='Occupancy'){const days=Math.max(1,nts(f,to));body=tbl(['Room type','Rooms','Booked nights','Occupancy'],T.map(t=>{const n=R.filter(r=>r.t===t.id).length,bn=l.filter(b=>act(b)&&b.t===t.id).reduce((s,b)=>s+b.u.length*Math.max(0,nts(b.ci<f?f:b.ci,b.co>to?to:b.co)),0);return[t.n,n,bn,Math.min(100,Math.round(bn/((n*days)||1)*100))+'%']}))}
else if(rt==='Revenue'){const p=l.filter(paid);body=tbl(['ID','Guest','Room','Amount'],p.map(b=>[b.id,esc(b.cust),rn(b),peso(b.total)]),'No paid bookings.')+`<div class="pr t"><span>Total revenue</span><span>${peso(p.reduce((s,b)=>s+b.total,0))}</span></div>`}
else if(rt==='Payment')body=tbl(['ID','Guest','Amount','Method','Payment','Reference'],l.map(b=>[b.id,esc(b.cust),peso(b.total),b.ref?'GCash':'Cash',bs(b.pay),esc(b.ref||'—')]),'No transactions.');
else if(rt==='Cancellation')body=tbl(['ID','Guest','Room','Total','Refund'],l.filter(b=>b.status==='Cancelled').map(b=>[b.id,esc(b.cust),rn(b),peso(b.total),b.refund||'—']),'No cancellations.');
else body=tbl(['ID','Guest','Room','Check-in','Check-out','Status'],l.map(b=>[b.id,esc(b.cust),rn(b),fd(b.ci),fd(b.co),bs(b.status)]),'No bookings.');
return`<h1>📈 Reports</h1><div class="row np" style="margin:12px 0"><select style="max-width:190px" onchange="S.rt=this.value;render()">${['Booking','Occupancy','Revenue','Payment','Cancellation'].map(x=>`<option value="${x}"${rt===x?' selected':''}>${x} report</option>`).join('')}</select><input type="date" style="max-width:150px" value="${f}" onchange="S.rf=this.value;render()"><input type="date" style="max-width:150px" value="${to}" onchange="S.rto=this.value;render()"><button class="btn s o" onclick="print()">🖨️ Print</button></div><div class="grid"><div class="card stat"><b>${l.length}</b><span>Bookings in range</span></div><div class="card stat"><b>${peso(l.filter(paid).reduce((s,b)=>s+b.total,0))}</b><span>Paid revenue</span></div><div class="card stat"><b>${l.filter(b=>b.status==='Cancelled').length}</b><span>Cancellations</span></div></div><h2>${rt} report</h2><div class="card">${body}</div>`},
staff(){const l=U.map((u,i)=>[u,i]).filter(([u])=>u.r==='Staff'),P4=['Payments','Walk-in','Rooms','Reports'];return`<h1>🧑‍💼 Staff Management</h1><div class="card" style="margin:12px 0">${tbl(['Name','Email','Status','Permissions','Actions'],l.map(([u,i])=>[esc(u.n),esc(u.e),st(u.a?'ok':'no',u.a?'Active':'Inactive'),P4.map(p=>`<label style="text-transform:none;display:inline-flex;gap:4px;margin-right:8px"><input type="checkbox" style="width:auto" ${!u.perm||u.perm.includes(p)?'checked':''} onchange="tglPerm(${i},'${p}')">${p}</label>`).join(''),`<button class="btn s o" onclick="U[${i}].a=!U[${i}].a;log('Toggled staff');render()">${u.a?'Deactivate':'Activate'}</button>`]),'No staff yet.')}</div><div class="card row"><input id="sn2" placeholder="Name" style="max-width:170px"><input id="se2" placeholder="Email" style="max-width:200px"><button class="btn" onclick="addStaff()">+ Add staff</button></div><p class="mu" style="margin-top:8px">New staff password: demo1234</p>`},
users(){return`<h1>👥 User Management</h1><div class="card" style="margin:12px 0">${tbl(['Name','Email','Role','Status','Created','Actions'],U.map((u,i)=>[esc(u.n),esc(u.e),`<select onchange="U[${i}].r=this.value;log('Role of ${esc(u.n)} → '+this.value)">${['Customer','Staff','Admin'].map(r=>`<option${u.r==r?' selected':''}>${r}</option>`).join('')}</select>`,st(u.a?'ok':'no',u.a?'Active':'Inactive'),u.c,`<button class="btn s o" onclick="U[${i}].a=!U[${i}].a;log('Toggled ${esc(u.n)}');render()">${u.a?'Deactivate':'Activate'}</button> <button class="btn s r" onclick="U.splice(${i},1);log('Deleted user');render()">Delete</button>`]))}</div><div class="card row"><input id="un" placeholder="Name" style="max-width:170px"><input id="ue" placeholder="Email" style="max-width:200px"><select id="ur" style="max-width:130px"><option>Customer</option><option>Staff</option><option>Admin</option></select><button class="btn" onclick="if(!$('#un').value||!$('#ue').value.includes('@'))return toast('⚠️ Name and valid email required');U.push({n:$('#un').value,e:$('#ue').value.toLowerCase(),r:$('#ur').value,a:1,pw:'demo1234',c:TD});log('Added user '+$('#un').value);render()">+ Add user</button></div>`},
types(){return`<h1>🛏️ Room Types</h1><div class="grid" style="margin-top:12px">${T.map((t,i)=>`<div class="card"><h3>${t.e} ${t.n}</h3><div class="f"><label>Price / night</label><input type="number" value="${t.p}" onchange="T[${i}].p=+this.value;log('Price of ${t.n} set to '+this.value);toast('Saved')"></div><div class="f"><label>Capacity</label><input type="number" value="${t.cap}" onchange="T[${i}].cap=+this.value;toast('Saved')"></div><div class="f"><label>Description</label><textarea rows="2" onchange="T[${i}].d=this.value;toast('Saved')">${esc(t.d)}</textarea></div><div class="f"><label>Amenities (comma-separated)</label><input value="${esc(t.am.join(', '))}" onchange="T[${i}].am=this.value.split(',').map(x=>x.trim()).filter(Boolean);toast('Saved')"></div></div>`).join('')}</div><div class="card row" style="margin-top:14px"><input id="tn" placeholder="New room type" style="max-width:180px"><input id="tpp" type="number" placeholder="₱ / night" style="max-width:120px"><input id="tc" type="number" placeholder="Capacity" style="max-width:110px"><button class="btn" onclick="addType()">+ Add room type</button></div>`},
price(){return`<h1>💵 Dynamic Pricing</h1><p class="mu" style="margin:6px 0 12px">Suggested rates based on today's occupancy and demand. You stay in control.</p><div class="card">${tbl(['Room type','Current','Occupancy','Demand','Suggested','Actions'],T.map((t,i)=>{const o=occ(t.id),s=Math.round(t.p*(o>.7?1.12:o<.3?.92:1)/50)*50;return[t.n,peso(t.p),Math.round(o*100)+'%',o>.7?st('no','High'):o<.3?st('','Low'):st('wa','Normal'),peso(s),`<button class="btn s g" onclick="T[${i}].p=${s};log('Accepted ${peso(s)} for ${t.n}');toast('Rate updated');render()">Accept</button> <button class="btn s o" onclick="toast('Suggestion rejected')">Reject</button> <input type="number" style="width:90px;padding:5px" placeholder="Manual" onchange="T[${i}].p=+this.value;log('Manual rate for ${t.n}');render()">`]}))}</div>`},
promos(){return`<h1>🏷️ Promotions</h1><div class="card" style="margin:12px 0">${tbl(['Code','Discount','Rooms','Start','End','Status','Actions'],P.map((p,i)=>[p.c,p.pc+'%',p.rt&&p.rt!=='all'?T.find(x=>x.id===p.rt).n:'All rooms',p.s,p.e,st(p.on?'ok':'no',p.on?'Active':'Off'),`<button class="btn s o" onclick="P[${i}].on=!P[${i}].on;render()">${p.on?'Deactivate':'Activate'}</button> <button class="btn s r" onclick="P.splice(${i},1);render()">Delete</button>`]))}</div><div class="card row"><input id="pcode" placeholder="CODE" style="max-width:140px"><input id="ppc" type="number" placeholder="%" style="max-width:80px"><select id="prt" style="max-width:170px"><option value="all">All rooms</option>${T.map(t=>`<option value="${t.id}">${t.n}</option>`).join('')}</select><input type="date" id="ps" style="max-width:150px" value="${TD}"><input type="date" id="pe" style="max-width:150px" value="${iso(90)}"><button class="btn" onclick="if(!$('#pcode').value||!+$('#ppc').value)return toast('⚠️ Code and % required');P.push({c:$('#pcode').value.toUpperCase(),pc:+$('#ppc').value,rt:$('#prt').value,on:1,s:$('#ps').value,e:$('#pe').value});log('Added promo');render()">+ Add promo</button></div>`},
hotel(){return`<h1>🏨 Hotel Information</h1><div class="card" style="max-width:560px;margin-top:12px">${[['name','Hotel name'],['desc','Description'],['addr','Address'],['phone','Contact'],['email','Email'],['pol','Policies'],['am','Amenities (emoji + name, comma-separated)']].map(f=>`<div class="f"><label>${f[1]}</label><input value="${esc(H[f[0]])}" onchange="H.${f[0]}=this.value"></div>`).join('')}<button class="btn" onclick="log('Hotel info updated');toast('✅ Saved')">Save</button></div>`},
sets(){return`<h1>⚙️ System Settings</h1><div class="card" style="max-width:560px;margin-top:12px"><div class="f"><label>Free cancellation (hours before check-in)</label><input type="number" value="${ST.cancelHrs}" onchange="ST.cancelHrs=+this.value"></div><div class="f"><label>GCash number</label><input value="${esc(ST.gcashNo)}" onchange="ST.gcashNo=this.value"></div><div class="f"><label>GCash account name</label><input value="${esc(ST.gcashName)}" onchange="ST.gcashName=this.value"></div><div class="f"><label>Tax / service fee (%)</label><input type="number" value="${ST.tax}" onchange="ST.tax=+this.value"></div><div class="row sp f"><span>Email notifications</span><div class="sw ${ST.notif?'on':''}" onclick="ST.notif=!ST.notif;render()"></div></div><button class="btn" onclick="log('Settings updated');toast('✅ Saved')">Save settings</button></div>`},
audit(){return`<h1>📝 Audit Logs</h1><div class="card" style="margin-top:12px">${tbl(['Who','Action','When'],LOG.map(l=>[esc(l.w),esc(l.m),l.t]),'No activity recorded yet.')}</div>`}};
function rc(l,b,g){const x=l.find(y=>y.t.id===b.pref)||l.slice().sort((p,q)=>(p.t.cap-g)-(q.t.cap-g)||p.t.p-q.t.p)[0];return`<div class="card" style="margin-top:12px;border-color:var(--sea)"><span class="tag ok">★ Recommended for you</span> <b>${x.t.e} ${x.t.n}</b><p class="mu">Best suited for ${g} guest${g>1?'s':''} based on capacity, price and amenities.${b.pref===x.t.id?' Matches your room preference.':''}</p><button class="btn s" onclick="S.bk.t='${x.t.id}';go('guest')">Select this room</button></div>`}
function resub(id){M(`<h3>Resubmit payment · ${id}</h3><div class="f" style="margin-top:10px"><label>GCash reference number</label><input id="rr2"></div><div class="f"><label>Proof of payment</label><input type="file" id="rp2" accept="image/*"></div><div id="re2" class="err"></div><div class="row"><button class="btn o" onclick="closeM()">Back</button><button class="btn" onclick="doResub('${id}')">Submit</button></div>`)}
function doResub(id){const b=B.find(x=>x.id===id),r=$('#rr2').value.trim(),f=$('#rp2').files[0];if(r.length<6||!f)return $('#re2').textContent='Enter a reference number and upload proof.';b.ref=r;b.proof=f.name;b.pay='Pending';b.rej='';notify('Staff','🔁 Payment resubmitted for '+id);log('Resubmitted payment '+id);closeM();toast('Payment resubmitted');render()}
function payCo(id){const b=B.find(x=>x.id===id);M(`<h3>Outstanding balance</h3><p style="margin:8px 0"><b>${peso(b.total)}</b> is unpaid for ${id}.</p><div class="f"><label>Payment method</label><select id="cm"><option>Cash</option><option>GCash</option><option>Card</option></select></div><div class="row"><button class="btn o" onclick="closeM()">Back</button><button class="btn g" onclick="closeM();setSt('${id}','Checked-out',1)">Collect &amp; Check-out</button></div>`)}
function editB(id){const b=B.find(x=>x.id===id);M(`<h3>Edit ${id}</h3><div class="row" style="margin:10px 0"><div style="flex:1"><label>Check-in</label><input type="date" id="ei" value="${b.ci}"></div><div style="flex:1"><label>Check-out</label><input type="date" id="eo" value="${b.co}"></div></div><div class="f"><label>Guests</label><input type="number" id="eg" min="1" value="${b.ad+b.ch}"></div><div class="f"><label>Special requests</label><textarea id="er" rows="2">${esc(b.req||'')}</textarea></div><div id="ee" class="err"></div><div class="row"><button class="btn o" onclick="closeM()">Back</button><button class="btn" onclick="saveB('${id}')">Save</button></div>`)}
function saveB(id){const b=B.find(x=>x.id===id),ci=$('#ei').value,co=$('#eo').value,g=+$('#eg').value,e=$('#ee');if(!ci||nts(ci,co)<1)return e.textContent='Check-out must be after check-in.';if(g<1||g>T.find(x=>x.id===b.t).cap*b.rooms)return e.textContent='Guests exceed room capacity.';if(b.u.some(n=>B.some(o=>o!==b&&act(o)&&o.u.includes(n)&&o.ci<co&&o.co>ci)))return e.textContent='❌ Room not available for those dates.';b.ci=ci;b.co=co;b.ad=g;b.ch=0;b.req=$('#er').value;b.total=price(b.t,ci,co,b.rooms).tot;notify('Customer','✏️ Booking '+id+' was updated by staff.');log('Edited '+id);closeM();toast('✅ Booking updated');render()}
function tglPerm(i,p){const u=U[i];u.perm=u.perm||['Payments','Walk-in','Rooms','Reports'];u.perm=u.perm.includes(p)?u.perm.filter(x=>x!==p):u.perm.concat(p);log('Permissions for '+u.n+': '+u.perm.join(', '));toast('Permissions saved')}
function addStaff(){const n=$('#sn2').value.trim(),e=$('#se2').value.trim().toLowerCase();if(!n||!e.includes('@')||U.some(x=>x.e===e))return toast('⚠️ Name and unique email required');U.push({n,e,r:'Staff',a:1,pw:'demo1234',c:TD});log('Added staff '+n);render()}
function addType(){const n=$('#tn').value.trim(),p=+$('#tpp').value,c=+$('#tc').value;if(!n||!p||!c)return toast('⚠️ Name, price and capacity required');T.push({id:'t'+Date.now(),n,p,cap:c,bed:'—',e:'🛏️',am:['Aircon','Wi-Fi'],d:'New room type.'});log('Added room type '+n);render()}
function brief(){const b=S.bk,t=T.find(x=>x.id===b.t);return t?`<h3>${t.e} ${t.n}</h3><p class="mu">${fd(b.ci)} → ${fd(b.co)} · ${nts(b.ci,b.co)} nights · ${b.ad+b.ch} guests · ${b.rooms} room(s)</p>`:''}
function occ(t){const n=R.filter(r=>r.t===t&&r.st!=='Maintenance').length;return n?B.filter(b=>act(b)&&b.t===t&&b.ci<=TD&&b.co>TD).reduce((s,b)=>s+b.u.length,0)/n:0}
function occBars(){return`<div class="card">${T.map(t=>{const o=occ(t.id);return`<div class="row" style="margin:6px 0"><span style="width:130px;font-size:13px">${t.n}</span><div class="bar" style="flex:1"><i style="width:${o*100}%"></i></div><b>${Math.round(o*100)}%</b></div>`}).join('')}</div>`}
function stats(){const s=[['Today\'s bookings',B.filter(b=>b.ts.startsWith(new Date().toLocaleDateString('en-PH'))).length],['Check-ins today',B.filter(b=>b.status==='Confirmed'&&b.ci<=TD).length],['Check-outs today',B.filter(b=>b.status==='Checked-in').length],['Upcoming',B.filter(b=>b.status==='Confirmed'&&b.ci>TD).length],['Pending payments',B.filter(b=>b.pay==='Pending').length],['Available rooms',R.filter(r=>r.st==='Available'&&!B.some(b=>b.status==='Checked-in'&&b.u.includes(r.no))).length],['Occupied rooms',B.filter(b=>b.status==='Checked-in').reduce((s,b)=>s+b.u.length,0)],['Cancelled',B.filter(b=>b.status==='Cancelled').length]];return`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr));margin-top:12px">${s.map(x=>`<div class="card stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>`}
function gNext(){const b=S.bk;b.name=$('#gn').value.trim();b.email=$('#ge').value.trim();b.phone=$('#gp').value.trim();b.addr=$('#ga').value.trim();b.req=$('#gr').value.trim();const e=$('#ger');
if(!b.name||!b.email.includes('@')||b.phone.length<7){e.textContent='Please enter your name, a valid email and contact number.';return}
const t=T.find(x=>x.id===b.t);if(b.ad+b.ch>t.cap*b.rooms){e.textContent='Room capacity is '+t.cap+' guests per room.';return}go('summary')}
function applyPromo(){const c=$('#pc').value.trim().toUpperCase(),p=P.find(x=>x.c===c&&x.on&&x.s<=TD&&x.e>=TD&&(!x.rt||x.rt==='all'||x.rt===S.bk.t));if(!p){S.bk.promo='';S.bk.pc=0;toast('❌ Invalid or expired promo');return render()}S.bk.promo=c;S.bk.pc=p.pc;toast('🎉 '+c+' applied');render()}
function submitPay(){const b=S.bk,rf=$('#rf').value.trim(),f=$('#pf').files[0],e=$('#per');if(rf.length<6){e.textContent='Enter a valid GCash reference number.';return}if(!f){e.textContent='Please upload proof of payment.';return}
const tot=price(b.t,b.ci,b.co,b.rooms,b.pc||0).tot,r=mk({cust:b.name,email:b.email,phone:b.phone,addr:b.addr,req:b.req,t:b.t,ci:b.ci,co:b.co,ad:b.ad,ch:b.ch,rooms:b.rooms,total:tot,src:'Online',ref:rf,proof:f.name});
if(!r){M(`<h2>😔 Room no longer available</h2><p>Someone just booked the last room for those dates. Your payment was not recorded.</p><div class="row" style="margin-top:14px"><button class="btn" onclick="go('avail')">Choose another room</button></div>`);return}
notify('Customer','📩 Booking '+r.id+' submitted. Payment awaiting verification.');notify('Staff','🆕 New booking '+r.id+' with payment to verify.');notify('Admin','🆕 New booking '+r.id+'.');S.bk={ci:iso(1),co:iso(3),ad:2,ch:0,rooms:1,t:''};go('confirm',r.id)}
function approve(id){const b=B.find(x=>x.id===id);b.pay='Approved';b.status='Confirmed';notify('Customer','✅ Payment approved — booking '+id+' confirmed!');log('Approved payment for '+id);toast('✅ '+id+' confirmed');render()}
function rejM(id){M(`<h3>Reject payment ${id}</h3><div class="f" style="margin-top:10px"><label>Reason</label><input id="rr" placeholder="e.g. Amount mismatch"></div><div class="row"><button class="btn o" onclick="closeM()">Back</button><button class="btn r" onclick="const b=B.find(x=>x.id==='${id}');b.pay='Rejected';b.rej=$('#rr').value||'no reason';notify('Customer','❌ Payment rejected for ${id}: '+b.rej+'. Please resubmit your payment.');log('Rejected payment ${id}');closeM();render()">Reject</button></div>`)}
function askCancel(id){const b=B.find(x=>x.id===id);M(`<h3>Cancel booking?</h3><p style="margin:8px 0">Are you sure you want to cancel <b>${id}</b>?</p><p class="mu">Policy: free cancellation up to ${ST.cancelHrs} hrs before check-in. Refund: ${b.pay==='Approved'?peso(b.total)+' (to GCash within 3–5 days)':'none — unpaid'}.</p><div class="row" style="margin-top:14px"><button class="btn o" onclick="closeM()">Keep Booking</button><button class="btn r" onclick="doCancel('${id}')">Confirm Cancellation</button></div>`)}
function doCancel(id){const b=B.find(x=>x.id===id);b.refund=['Approved','Paid'].includes(b.pay)?'Refund pending':'No payment to refund';b.status='Cancelled';notify('Customer','🗑️ Booking '+id+' cancelled. Room released. '+b.refund+'.');notify('Staff','⚠️ Cancellation: '+id);log('Cancelled '+id);closeM();toast('Booking cancelled');render()}
function staffCancel(id){askCancel(id)}
function setSt(id,s,paid){const b=B.find(x=>x.id===id);if(s==='Checked-out'&&!paid&&!['Approved','Paid'].includes(b.pay))return payCo(id);b.status=s;if(s==='Checked-out')b.pay='Paid';notify('Customer',(s==='Checked-in'?'🛎️ Checked in: ':'🚪 Checked out: ')+id);log(s+' '+id);toast('✅ '+s);render()}
function bdet(id){const b=B.find(x=>x.id===id);M(`<h3>${b.id} ${bs(b.status)}</h3><div style="margin:10px 0">${[['Customer',esc(b.cust)],['Email',esc(b.email)],['Phone',esc(b.phone)],['Room',T.find(x=>x.id===b.t).n+' ('+b.u.join(', ')+')'],['Dates',fd(b.ci)+' → '+fd(b.co)],['Payment',bs(b.pay)],['Reference',esc(b.ref||'—')],['Proof',esc(b.proof||'—')],['Total',peso(b.total)],['Requests',esc(b.req||'—')]].map(r=>`<div class="pr"><span class="mu">${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div><button class="btn" onclick="closeM()">Close</button>`)}
function doWalk(){const e=$('#wer'),n=$('#wn').value.trim(),c=$('#wc').value.trim(),ci=$('#wi').value,co=$('#wo').value,t=$('#wt').value,g=+$('#wg').value;
if(!n||!c)return e.textContent='Name and contact are required.';if(!ci||nts(ci,co)<1)return e.textContent='Check dates are invalid.';if(g>T.find(x=>x.id===t).cap)return e.textContent='Exceeds room capacity.';
const b=mk({cust:n,email:c,phone:c,t,ci,co,ad:g,ch:0,rooms:1,total:price(t,ci,co).tot,pay:'Paid',status:ci<=TD?'Checked-in':'Confirmed',src:'Walk-in'});if(!b)return e.textContent='❌ No room available for those dates.';
log('Walk-in booking '+b.id);notify('Admin','🚶 Walk-in '+b.id);toast('✅ '+b.id+' · Room '+b.u[0]+' reserved');go('sbook')}
function recommend(){const g=+$('#rg').value,n=+$('#rn').value,bd=+$('#rb').value,pr=[...document.querySelectorAll('.rp:checked')].map(x=>x.value);
const sc=T.map(t=>{let s=0,w=[];if(t.cap>=g){s+=50;w.push('fits '+g+' guests')}if(t.p<=bd){s+=30;w.push('within budget')}if(t.cap>=g&&t.cap-g<=1)s+=10;pr.forEach(p=>{if(t.am.some(a=>a.includes(p.replace('view','view')))){s+=8;w.push('has '+p.toLowerCase())}});if(n>=4&&t.cap>=g)s+=5;return{t,s,w}}).sort((a,b)=>b.s-a.s),top=sc[0];
S.recR=`<div class="card" style="border-color:var(--sea)"><span class="tag ok">★ Recommended for you</span><h2 style="margin-top:6px">${top.t.e} ${top.t.n}</h2><p>${peso(top.t.p)}/night · ${peso(top.t.p*n)} for ${n} nights</p><p class="mu">Why: ${top.w.join(', ')||'closest match'}.</p><p style="margin:8px 0">${top.t.am.map(a=>st('',a)).join('')}</p><button class="btn" onclick="pick('${top.t.id}')">Book this room</button></div><h3 style="margin:12px 0 6px">Alternatives</h3>${sc.slice(1,3).map(x=>`<div class="card" style="margin-bottom:8px"><b>${x.t.n}</b> · ${peso(x.t.p)}/night<br><span class="mu">${x.t.cap>=g?'Also fits your group':'Smaller than your group'}</span></div>`).join('')}`;render()}
function doLogin(){const e=$('#le').value.trim().toLowerCase(),p=$('#lp').value;if(!e.includes('@')||!p){$('#lerr').textContent='Enter your email and password.';return}const u=U.find(x=>x.e===e);if(!u||u.pw!==p){$('#lerr').textContent='Invalid email or password. Please try again.';return}quick(e)}
function quick(e){const r=e.includes('admin')?'Admin':e.includes('staff')?'Staff':'Customer';let u=U.find(x=>x.e===e);if(!u){u={n:e.split('@')[0],e,r,a:1,c:TD};U.push(u)}if(!u.a){toast('⛔ Account deactivated');return}S.role=u.r==='Customer'?'Customer':u.r;S.user=u;log('Logged in');toast('👋 Welcome, '+u.n);go(S.role==='Admin'?'adash':S.role==='Staff'?'sdash':'home')}
function doSignup(){const g=i=>$('#'+i).value.trim(),e=$('#serr');if(!g('sn')||!g('se').includes('@')||g('sp').length<7)return e.textContent='Complete all fields with valid details.';if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(g('s1')))return e.textContent='Password needs 8+ characters with a letter and a number.';if(U.some(x=>x.e===g('se').toLowerCase()))return e.textContent='This email is already registered.';if(g('s1')!==g('s2'))return e.textContent='Passwords do not match.';if(!$('#st').checked)return e.textContent='Please accept the Terms & Conditions.';
U.push({n:g('sn'),e:g('se').toLowerCase(),ph:g('sp'),r:'Customer',a:1,pw:g('s1'),c:TD});toast('🎉 Account created. Please log in.');go('login')}
function saveProf(){const u=S.user;u.n=$('#pn').value;u.ph=$('#pph').value;u.ad=$('#pa').value;toast('✅ Profile saved');render()}
function chPw(){if(!$('#p1').value||$('#p2').value.length<6)return toast('⚠️ Enter current & a 6+ char new password');if($('#p2').value!==$('#p3').value)return toast('⚠️ Passwords do not match');toast('✅ Password updated')}
function runDemo(){const ci=$('#dd1').value,co=$('#dd2').value;if(!ci||nts(ci,co)<1)return toast('⚠️ Invalid dates');const box=$('#demo');box.innerHTML='<p class="mu">Both customers click “Confirm” at the same time…</p>';
setTimeout(()=>{const mkb=n=>mk({cust:n,email:n.toLowerCase().replace(' ','')+'@mail.com',phone:'0917',t:'pre',ci,co,ad:2,ch:0,rooms:1,total:price('pre',ci,co).tot,src:'Online',ref:'DEMO123'});
const a=mkb('Customer A'),b=mkb('Customer B');const row=(n,r)=>`<div class="card" style="margin-bottom:8px;border-color:${r?'var(--ok)':'var(--coral)'}"><b>${n}</b> — ${r?'✅ Booked room '+r.u[0]+' ('+r.id+')':'❌ Room no longer available.'}</div>`;
box.innerHTML=`<p class="mu">System re-checks availability atomically before confirming:</p>${row('Customer A',a)}${row('Customer B',b)}<p><b>Result:</b> only ONE booking succeeded — no double booking.</p>`;log('Double-booking demo run')},900)}
render();
</script></body></html>
